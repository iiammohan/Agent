[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futureyou"
version = "0.1.0"
description = "An agent that writes back from the life you're building: one sentence a day, answered by you at 70."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
futureyou = "futureyou.cli:main"

[tool.setuptools.packages.find]
include = ["futureyou*"]

[tool.setuptools.package-data]
"futureyou.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
